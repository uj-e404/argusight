services:
  argusight:
    # To use pre-built image instead of building locally:
    # image: ghcr.io/uj-e404/argusight:latest
    build: .
    container_name: argusight
    ports:
      - "${PORT:-4959}:${PORT:-4959}"
    volumes:
      - ./config:/app/config
      - ${SSH_KEY_DIR:-~/.ssh}:/app/config/keys:ro
    environment:
      - PORT=${PORT:-4959}
      - NODE_ENV=production
      - CONFIG_PATH=/app/config
      # Set to "true" if behind HTTPS reverse proxy
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    # Next.js 16 SWC uses Rust/tokio which requires Unix domain sockets
    # for signal handling. Docker's default AppArmor profile blocks this.
    security_opt:
      - apparmor=unconfined
    restart: unless-stopped
